volumes:
  postgres_db:

services:
  postgres_db:
    build: .
    container_name: my-postgres-container
    restart: always
    environment:
      POSTGRES_USER: godspride
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: tasktable
    volumes:
      - postgres_db:/var/lib/postgresql/data
    ports:
      - "5433:5432"

