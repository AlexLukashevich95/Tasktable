volumes:
  postgres_db:

services:
  postgres_db:
    build: .
    container_name: my-postgres-container
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_db:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
